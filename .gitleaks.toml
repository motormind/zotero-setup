# Extends the default rules with Zotero API keys (24 alphanumeric characters).
[extend]
useDefault = true

[[rules]]
id = "zotero-api-key"
description = "Zotero API key"
regex = '''(?i)zotero[_-]?api[_-]?key\s*[:=]\s*["']?([A-Za-z0-9]{24})["']?'''
secretGroup = 1

[allowlist]
description = "Placeholders in templates and docs"
regexes = ['''your_api_key_here''', '''XXXXXXXXXXXXXXXXXXXXXXXX''']
